AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:

# DynamoDB: ss

  SesionesEvaluacionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sesiones_evaluacion
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_usuario
          AttributeType: S
        - AttributeName: tipo_prueba
          AttributeType: S
      KeySchema:
        - AttributeName: id_usuario
          KeyType: HASH
        - AttributeName: tipo_prueba
          KeyType: RANGE


  TareasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tareas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_usuario
          AttributeType: S
        - AttributeName: id_tarea
          AttributeType: S
      KeySchema:
        - AttributeName: id_usuario
          KeyType: HASH
        - AttributeName: id_tarea
          KeyType: RANGE


  PropuestasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: propuestas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_usuario
          AttributeType: S
        - AttributeName: id_propuesta
          AttributeType: S
      KeySchema:
        - AttributeName: id_usuario
          KeyType: HASH
        - AttributeName: id_propuesta
          KeyType: RANGE

  
  CategoriasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: categorias
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_usuario
          AttributeType: S
        - AttributeName: id_categoria
          AttributeType: S
      KeySchema:
        - AttributeName: id_usuario
          KeyType: HASH
        - AttributeName: id_categoria
          KeyType: RANGE



# Cognito

  # Esto crea el user pool o sea donde se guarda a la gentita, tengo que chequear el lambdaconfig por si quiero hacer algo chévere lowkey
  UsuariosRegistro:
    Type: AWS::Cognito::UserPool
    Properties:
      AccountRecoverySetting: 
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig: 
        AllowAdminCreateUserOnly: False
      AutoVerifiedAttributes: 
        - email
      DeletionProtection: INACTIVE
      # LambdaConfig: 
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          PasswordHistorySize: 22
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
      Schema: 
          - Name: given_name
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: family_name
            AttributeDataType: String
            Required: true
            Mutable: true  
          - Name: universidad
            AttributeDataType: String
            Required: false
            Mutable: true  
          - Name: codigo
            AttributeDataType: String
            Required: false
            Mutable: true                
      UsernameAttributes: 
        - email
      UsernameConfiguration: 
          CaseSensitive: False
      UserPoolName: todo-chatbot-usuarios
      UserPoolTags: 
        proyecto: tesis
      UserPoolTier: ESSENTIALS
      VerificationMessageTemplate: 
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailMessage: 'Verifica tu correo para Todol con el siguiente código: {####}'
        EmailSubject: 'TODOL: Tu código de confirmación'

  # El pool guarda a los usuarios, y el client es la puerta de entrada de la app a ese pool: define cómo se conecta y con qué permisos.
  UsuariosRegistroCliente:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: todo-chatbot-usuarios-cliente
        ExplicitAuthFlows: 
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        GenerateSecret: false
        PreventUserExistenceErrors: ENABLED
        SupportedIdentityProviders: 
          - COGNITO
        UserPoolId: !Ref UsuariosRegistro

# API Gateway

  ApiTodoChatbot:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth: 
          Authorizers: 
            Cognito:
                IdentitySource: "$request.header.Authorization"
                JwtConfiguration:
                  issuer:  !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UsuariosRegistro}'
                  audience:
                    - !Ref UsuariosRegistroCliente
          DefaultAuthorizer: Cognito
      CorsConfiguration: 
          MaxAge: 600
          AllowHeaders: 
            - Authorization
            - Content-Type
          AllowMethods: 
            - GET
            - POST
            - PATCH
            - DELETE
            - OPTIONS
          AllowOrigins: 
            - http://localhost:5173
      Description: Api de acceso
      Name: todo-chatbot-api
      PropagateTags: True
      Tags: 
        proyecto: tesis
      # DefaultRouteSettings: RouteSettings
      # RouteSettings: RouteSettings

# Lambda

## Primera funcion
  FunctionMe:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/me/
      Handler: me.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      Environment:
        Variables:
          TABLA_EVALUACIONES: !Ref SesionesEvaluacionTable
          TABLA_TAREAS: !Ref TareasTable
          TABLA_PROPUESTAS: !Ref PropuestasTable
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /me
            Method: GET

## Función: Obtener tareas del usuario
  FunctionObtenerTareas:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/obtener_tareas/
      Handler: obtener_tareas.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      Environment:
        Variables:
          TABLA_TAREAS: !Ref TareasTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TareasTable
      Events:
        ObtenerTareas:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /obtener_tareas
            Method: GET 

## Función: Registrar tarea
  FunctionRegistrarTareas:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/registrar_tareas/
      Handler: registrar_tareas.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      Environment:
        Variables:
          TABLA_TAREAS: !Ref TareasTable
          TABLA_CATEGORIAS: !Ref CategoriasTable
      Policies:
      - Statement:
          - Sid: RegistrarTareas
            Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource: !GetAtt TareasTable.Arn

          - Sid: ConsultarYValidarCategorias
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:ConditionCheckItem
            Resource: !GetAtt CategoriasTable.Arn
      Events:
        RegistrarTareas:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /registrar_tareas
            Method: POST 

## Función: Actualizar tarea
  FunctionActualizarTareas:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/actualizar_tareas/
      Handler: actualizar_tareas.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      Environment:
        Variables:
          TABLA_TAREAS: !Ref TareasTable
          TABLA_CATEGORIAS: !Ref CategoriasTable
      Policies:
        - Statement:
            - Sid: ActualizarYConsultarTarea
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt TareasTable.Arn

            - Sid: ConsultarYValidarCategoria
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt CategoriasTable.Arn
      Events:
        ActualizarTareas:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /tareas/{id_tarea}
            Method: PATCH 


  # Función: Completar tarea del usuario
  FunctionCompletarTarea:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/completar_tarea/
      Handler: completar_tarea.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64

      Environment:
        Variables:
          TABLA_TAREAS: !Ref TareasTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt TareasTable.Arn

      Events:
        CompletarTarea:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /tareas/{id_tarea}/completar
            Method: PATCH

  # Función: Eliminar tarea del usuario
  FunctionEliminarTarea:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/eliminar_tarea/
      Handler: eliminar_tarea.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64

      Environment:
        Variables:
          TABLA_TAREAS: !Ref TareasTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt TareasTable.Arn

      Events:
        EliminarTarea:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /tareas/{id_tarea}/eliminar
            Method: PATCH

  
  # Funcion: Interpretar mensajes con DeepSeek
  FunctionGenerarPropuesta:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/generar_propuesta/
      Handler: generar_propuesta.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      Timeout: 180
      MemorySize: 256

      Environment:
        Variables:
          TABLA_TAREAS: !Ref TareasTable
          TABLA_PROPUESTAS: !Ref PropuestasTable
          TABLA_CATEGORIAS: !Ref CategoriasTable
          BEDROCK_MODEL_ID: deepseek.v3-v1:0
          ZONA_HORARIA: America/Lima

      Policies:
        - Statement:
            - Sid: LeerTareas
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt TareasTable.Arn

            - Sid: GestionarPropuestas
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt PropuestasTable.Arn

            - Sid: LeerCategorias
              Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt CategoriasTable.Arn

            - Sid: InvocarDeepSeek
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub
                arn:aws:bedrock:${AWS::Region}::foundation-model/deepseek.v3-v1:0

      Events:
        GenerarPropuesta:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /propuestas/generar
            Method: POST


  # Función: Aceptar propuesta del agente
  
  FunctionAceptarPropuesta:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/aceptar_propuesta/
      Handler: aceptar_propuesta.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      Timeout: 15

      Environment:
        Variables:
          TABLA_TAREAS: !Ref TareasTable
          TABLA_PROPUESTAS: !Ref PropuestasTable
          TABLA_CATEGORIAS: !Ref CategoriasTable

      Policies:
        - Statement:
            - Sid: LeerYModificarTareas
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt TareasTable.Arn

            - Sid: LeerYActualizarPropuestas
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PropuestasTable.Arn

            - Sid: ConsultarYVerificarCategorias
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt CategoriasTable.Arn

      Events:
        AceptarPropuesta:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /propuestas/{id_propuesta}/aceptar
            Method: POST



  
  # Función: Cancelar propuesta del agente
  FunctionCancelarPropuesta:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/cancelar_propuesta/
      Handler: cancelar_propuesta.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64

      Environment:
        Variables:
          TABLA_PROPUESTAS: !Ref PropuestasTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PropuestasTable.Arn

      Events:
        CancelarPropuesta:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /propuestas/{id_propuesta}/cancelar
            Method: POST

  
  # Función: Obtener historial de propuestas
  FunctionObtenerPropuestas:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/obtener_propuestas/
      Handler: obtener_propuestas.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64

      Environment:
        Variables:
          TABLA_PROPUESTAS: !Ref PropuestasTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt PropuestasTable.Arn

      Events:
        ObtenerPropuestas:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /propuestas
            Method: GET


  # Función: Gestión de categorías
  FunctionCategorias:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/categorias/
      Handler: categorias.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64

      Environment:
        Variables:
          TABLA_CATEGORIAS: !Ref CategoriasTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt CategoriasTable.Arn

      Events:
        ObtenerCategorias:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /categorias
            Method: GET

        RegistrarCategoria:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /categorias
            Method: POST

        EliminarCategoria:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /categorias/{id_categoria}
            Method: DELETE

## Función: Gestión de evaluaciones
  FunctionEvaluacion:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/evaluacion/
      Handler: evaluacion.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TABLA_EVALUACIONES: !Ref SesionesEvaluacionTable
      Policies:
        - Statement:
            - Sid: GestionarEvaluacionesUsuario
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SesionesEvaluacionTable.Arn
      Events:
        EstadoEvaluacion:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /evaluacion/estado
            Method: GET
        PrepararEvaluacion:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /evaluacion/preparar
            Method: POST
        IniciarEvaluacion:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /evaluacion/iniciar
            Method: POST
        FinalizarEvaluacion:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /evaluacion/finalizar
            Method: POST
        GuardarRawTlx:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /evaluacion/raw-tlx
            Method: POST
        GuardarSus:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiTodoChatbot
            Path: /evaluacion/sus
            Method: POST


Outputs:
  ApiUrl:
    Value: !Sub 'https://${ApiTodoChatbot}.execute-api.${AWS::Region}.amazonaws.com'
  UserPoolId:
    Value: !Ref UsuariosRegistro
  UserPoolClientId:
    Value: !Ref UsuariosRegistroCliente


