AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tablas DynamoDB del MVP de lista de tareas con chatbot (sesiones_evaluacion, tareas, propuestas)

Resources:

# DynamoDB

  SesionesEvaluacionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sesiones_evaluacion
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_usuario
          AttributeType: S
        - AttributeName: tipo_prueba
          AttributeType: S
      KeySchema:
        - AttributeName: id_usuario
          KeyType: HASH
        - AttributeName: tipo_prueba
          KeyType: RANGE


  TareasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tareas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_usuario
          AttributeType: S
        - AttributeName: id_tarea
          AttributeType: S
      KeySchema:
        - AttributeName: id_usuario
          KeyType: HASH
        - AttributeName: id_tarea
          KeyType: RANGE


  PropuestasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: propuestas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_usuario
          AttributeType: S
        - AttributeName: id_propuesta
          AttributeType: S
      KeySchema:
        - AttributeName: id_usuario
          KeyType: HASH
        - AttributeName: id_propuesta
          KeyType: RANGE

# Cognito

  # Esto crea el user pool o sea donde se guarda a la gentita, tengoq ue chequear el lambdaconfig por si quiero hacer algo chévere lowkey
  UsuariosRegistro:
    Type: AWS::Cognito::UserPool
    Properties:
      AccountRecoverySetting: 
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig: 
        AllowAdminCreateUserOnly: False
      AutoVerifiedAttributes: 
        - email
      DeletionProtection: INACTIVE
      # LambdaConfig: 
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          PasswordHistorySize: 22
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
      Schema: 
          - Name: given_name
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: family_name
            AttributeDataType: String
            Required: true
            Mutable: true  
          - Name: universidad
            AttributeDataType: String
            Required: false
            Mutable: true  
          - Name: codigo
            AttributeDataType: String
            Required: false
            Mutable: true                
      UsernameAttributes: 
        - email
      UsernameConfiguration: 
          CaseSensitive: False
      UserPoolName: todo-chatbot-usuarios
      UserPoolTags: 
        proyecto: tesis
      UserPoolTier: ESSENTIALS
      VerificationMessageTemplate: 
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailMessage: 'Verifica tu correo para Todol con el siguiente código: {####}'
        EmailSubject: 'TODOL: Tu código de confirmación'

  # El pool guarda a los usuarios, y el client es la puerta de entrada de la app a ese pool: define cómo se conecta y con qué permisos.
  UsuariosRegistroCliente:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: todo-chatbot-usuarios-cliente
        ExplicitAuthFlows: 
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        GenerateSecret: false
        PreventUserExistenceErrors: ENABLED
        SupportedIdentityProviders: 
          - COGNITO
        UserPoolId: !Ref UsuariosRegistro

# API Gateway

  ApiTodoChatbot:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth: 
          Authorizers: 
            Cognito:
                IdentitySource: "$request.header.Authorization"
                JwtConfiguration:
                  issuer:  !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UsuariosRegistro}'
                  audience:
                    - !Ref UsuariosRegistroCliente
          DefaultAuthorizer: Cognito
      CorsConfiguration: 
          AllowHeaders: 
            - Authorization
            - Content-Type
          AllowMethods: 
            - GET
            - POST
            - PATCH
            - DELETE
            - OPTIONS
          AllowOrigins: 
            - http://localhost:5173
      Description: Api de acceso
      Name: todo-chatbot-api
      PropagateTags: True
      Tags: 
        proyecto: tesis
      # DefaultRouteSettings: RouteSettings
      # RouteSettings: RouteSettings

      


